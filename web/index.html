<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="寺院カレンダー - 六曜・法事カレンダー">

  <!-- ビューポート設定（モバイル対応） -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- PWA・オフライン対応メタタグ -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="寺院カレンダー">

  <!-- テーマカラー -->
  <meta name="theme-color" content="#5D4037">

  <!-- アイコン -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>寺院カレンダー</title>
  <link rel="manifest" href="manifest.json">

  <!-- オフラインフォールバック用スタイル（Service Worker登録前の画面） -->
  <style>
    body {
      margin: 0;
      background-color: #EFEBE9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #loading {
      text-align: center;
      font-family: sans-serif;
      color: #5D4037;
    }
    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #D7CCC8;
      border-top: 4px solid #5D4037;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #offline-message {
      display: none;
      color: #BF360C;
      margin-top: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <!-- ローディング表示（Flutterアプリ起動前） -->
  <div id="loading">
    <div class="spinner"></div>
    <p>読み込み中...</p>
    <p id="offline-message">オフラインです。キャッシュから読み込みます...</p>
  </div>

  <script>
    // オフライン状態を検知して表示を切り替え
    window.addEventListener('online', function() {
      document.getElementById('offline-message').style.display = 'none';
    });
    window.addEventListener('offline', function() {
      document.getElementById('offline-message').style.display = 'block';
    });
    if (!navigator.onLine) {
      document.getElementById('offline-message').style.display = 'block';
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
